version: "3"

vars:
  CSS_IN: web/tailwind.css
  CSS_OUT: internal/ui/static/app.css

tasks:
  dev:
    desc: Run with templates and assets served from disk, rebuilding CSS on change
    deps: [css:watch, run:dev]

  run:dev:
    internal: true
    cmds:
      - go run -tags dev .

  build:
    desc: Build the binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o registry-ui .

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  bench:
    desc: >-
      Run the benchmarks and save them to bench-<commit>-<time>.txt (about two minutes).
      Pass go test flags after --, e.g. `task bench -- -bench Catalog`;
      to compare before and after, run each with `-- -count 6` (about ten minutes for all of them)
      and then `go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e old.txt new.txt`.
    vars:
      OUT:
        sh: echo "bench-$(git describe --always --dirty)-$(date +%Y%m%d-%H%M%S).txt"
    set: [pipefail]
    cmds:
      - go test -run '^$' -bench . -timeout 0 {{.CLI_ARGS}} ./... | tee {{.OUT}}
      - echo "Saved to {{.OUT}}."

  lint:
    desc: Vet and lint
    cmds:
      - go vet ./...
      - go vet -tags budget .
      - golangci-lint run

  css:
    desc: Compile Tailwind
    cmds:
      - tailwindcss -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify

  css:watch:
    internal: true
    cmds:
      # "always" keeps watching when task doesn't attach stdin.
      - tailwindcss -i {{.CSS_IN}} -o {{.CSS_OUT}} --watch=always

  image:
    desc: Build the container image with Nix and load it into Docker
    cmds:
      - nix build .#image
      - docker load < result

  budget:
    desc: Check the image size, idle memory and idle work budgets (Linux, about two minutes)
    cmds:
      - nix build .#image
      - |
        size=$(gzip -dc result | wc -c)
        echo "Image is $((size / 1000)) kB uncompressed (budget 20000 kB)."
        test "$size" -lt 20000000
      - go test -tags budget -run TestBudget -count=1 -v -timeout 10m .
