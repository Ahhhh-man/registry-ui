version: "3"

vars:
  CSS_IN: web/tailwind.css
  CSS_OUT: internal/ui/static/app.css

tasks:
  dev:
    desc: Run with templates and assets served from disk, rebuilding CSS on change
    deps: [css:watch, run:dev]

  run:dev:
    internal: true
    cmds:
      - go run -tags dev .

  build:
    desc: Build the binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o registry-ui .

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  lint:
    desc: Vet and lint
    cmds:
      - go vet ./...
      - golangci-lint run

  css:
    desc: Compile Tailwind
    cmds:
      - tailwindcss -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify

  css:watch:
    internal: true
    cmds:
      # "always" keeps watching when task doesn't attach stdin.
      - tailwindcss -i {{.CSS_IN}} -o {{.CSS_OUT}} --watch=always

  image:
    desc: Build the container image with Nix and load it into Docker
    cmds:
      - nix build .#image
      - docker load < result
