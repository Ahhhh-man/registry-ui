name: dockerhub-description

# Keeps the Docker Hub page in step with the README, with a note up top that
# ghcr is the preferred image.
on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the ghcr note
        run: |
          cat - README.md > dockerhub.md <<'NOTE'
          > **Prefer `ghcr.io/ahhhh-man/registry-ui`.** This Docker Hub repository is a mirror of the same image, with the same tags and digests.

          NOTE

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ahhhhman/registry-ui
          short-description: See what's in your container registry, including your pull-through cache.
          readme-filepath: dockerhub.md
          enable-url-completion: true
