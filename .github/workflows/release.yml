name: release

# A stable tag (vX.Y.Z) publishes ghcr.io/ahhhh-man/registry-ui:X.Y.Z and latest
# as one amd64+arm64 manifest list, copies it to Docker Hub (ahhhhman/registry-ui),
# then creates a GitHub release.
# Run by hand, it builds both images only; untick dry-run to also push them as
# sha-<commit> (no semver tags, no release).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and size-check both images without pushing
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ahhhh-man/registry-ui
  # Docker Hub names can't contain dashes, hence the different namespace.
  DOCKERHUB_REPO: ahhhhman/registry-ui
  # 20 MB, measured on the uncompressed image tarball.
  MAX_IMAGE_BYTES: 20000000

jobs:
  image:
    name: image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    # Each leg sets only its own arch's output, so the two don't overwrite each other.
    outputs:
      amd64: ${{ steps.push.outputs.amd64 }}
      arm64: ${{ steps.push.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check the tag matches the version in default.nix
        if: github.ref_type == 'tag'
        run: |
          version=$(nix eval --raw .#default.version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match default.nix version $version"
            exit 1
          fi

      - name: Build
        run: |
          nix build .#image
          gzip -dc result > image.tar

      - name: Check size
        run: |
          size=$(stat -c %s image.tar)
          echo "uncompressed image: $size bytes (limit $MAX_IMAGE_BYTES)"
          if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "::error::image is $size bytes uncompressed, over the $MAX_IMAGE_BYTES limit"
            exit 1
          fi

      - name: Put crane on PATH
        if: github.event_name == 'push' || inputs.dry-run == false
        run: echo "$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#crane)/bin" >> "$GITHUB_PATH"

      - name: Push
        id: push
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushed by digest, untagged: only the multi-arch index gets tags.
        run: |
          digest=$(crane digest --tarball image.tar)
          crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          crane push image.tar "$IMAGE@$digest"
          echo "$ARCH=$digest" >> "$GITHUB_OUTPUT"

  manifest:
    needs: image
    if: github.event_name == 'push' || inputs.dry-run == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Put crane on PATH
        run: echo "$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#crane)/bin" >> "$GITHUB_PATH"

      - name: Merge into one multi-arch manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD64: ${{ needs.image.outputs.amd64 }}
          ARM64: ${{ needs.image.outputs.arm64 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            tags=("$v" latest)
          else
            tags=("sha-${GITHUB_SHA::7}")
          fi
          crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          crane index append -m "$IMAGE@$AMD64" -m "$IMAGE@$ARM64" -t "$IMAGE:${tags[0]}"
          for t in "${tags[@]:1}"; do crane tag "$IMAGE:${tags[0]}" "$t"; done

      # A copy, not a rebuild, so both registries serve the same digests.
      - name: Copy to Docker Hub
        if: github.ref_type == 'tag'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          crane auth login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin <<< "$DOCKERHUB_TOKEN"
          crane copy "$IMAGE:$v" "docker.io/$DOCKERHUB_REPO:$v"
          crane tag "docker.io/$DOCKERHUB_REPO:$v" latest

  release:
    needs: manifest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Full history and tags, so release-note can find the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Notes come from the commits since the previous tag, laid out by
      # .github/release-note.jinja. The token resolves commit authors to GitHub users.
      - name: Write release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run github:purpleclay/release-note/bb08aad6197d895be17af90967946712d54a76df -- "$GITHUB_REF_NAME" > notes.md # 0.12.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md
